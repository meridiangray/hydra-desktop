<!doctype html>
<html lang="en" data-mode="{{ look.mode }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archives · Hydra</title>
<style>
{{ css }}{{ look_css }}</style></head><body>
<main id="welcome">
<section class="actions" aria-label="Actions">
<button id="newproj" type="button" aria-label="New project" title="New project" aria-expanded="false" aria-controls="wizard">{{ icons.file_plus }}</button>
</section>
<section class="lane" id="wizard" hidden>
<h1>New project</h1>
<ol class="steps" id="steps"><i class="on"></i><i></i><i></i><i></i><i></i></ol>
<div class="step" data-step="0">
<h2>New project</h2>
<label class="fl" for="pname">Name</label>
<input id="pname" type="text" placeholder="Family papers" autocomplete="off">
</div>
<div class="step" data-step="1" hidden>
<h2>View</h2>
<div class="vcards">
{% for v in views %}
<label class="vcard{{ ' flow' if v.flow }}"><input type="radio" name="view" value="{{ v.key }}"{{ ' checked' if v.checked }}>
    {{ v.icon }}<b>{{ v.label }}</b></label>
{% endfor %}
</div>
</div>
<div class="step" data-step="2" hidden>
<h2>Folder</h2>
<label class="fl" for="pfolder">Folder (new or empty)</label>
<div class="frow"><input id="pfolder" type="text"><button id="browse" type="button">Browse…</button></div>
</div>
<div class="step" data-step="3" hidden>
<h2>Sources</h2>
<div class="frow"><button id="adddocs" type="button">Add documents…</button></div>
<div class="docs" id="docs"></div>
<p class="note">Optional.</p>
</div>
<div class="step" data-step="4" hidden>
<h2>Theme</h2>
<div class="tcards">
{% for t in themes %}
<label class="tcard"><input type="radio" name="theme" value="{{ t.name }}"{{ ' checked' if t.checked }}>
    <span class="sw">{% for c in t.dots %}<i style='background:{{ c }}'></i>{% endfor %}</span><b>{{ t.name }}</b></label>
{% endfor %}
</div>
</div>
<div class="wizbar"><button id="wback" type="button" disabled>Back</button><span class="grow"></span>
<button id="wnext" type="button">Next</button><button id="wcreate" type="button" hidden>Create project</button></div>
<p id="created" role="status"></p>
</section>
<section class="lane" id="recent">
<div class="rhead"><h1>Recent</h1>
<div class="ropen">{% if current %}<a class="current" href="{{ start }}">Return to {{ current }}</a>{% endif %}
<button id="pack" class="tb" type="button" aria-label="Open .hydra file" title="Open .hydra file">{{ icons.file }}</button>
<button id="folder" class="tb" type="button" aria-label="Open archive folder" title="Open archive folder">{{ icons.folder_open }}</button></div></div>

{% if recents %}<ul class="dirs">{% for r in recents %}<li><button class="recent" data-path="{{ r.path }}"
            title="{{ r.path }}"{{ ' disabled' if not r.available }}>{{ icons.folder }}
            <span class="recent-name">{{ r.label }}</span>{% if not r.available %}<i class=missing>Not found</i>{% endif %}</button></li>{% endfor %}</ul>{% endif %}
<p id="error" role="alert"></p>
</section>
</main>

<h2 id="loading-title">Opening archive</h2>
<div class="loader-bar"><span id="loading-stage"></span><span class="loader-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="loading-fill" class="loader-fill"></span></span><span id="loading-percent">0%</span></div>
<p id="loading-name" class="loading-name"></p></div></div>
<script type="application/json" id="boot">{{ boot|tojson }}</script>
<script>
{{ js }}</script></body></html>
